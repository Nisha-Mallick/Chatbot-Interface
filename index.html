<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modern AI ChatBot</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

</head>

<body class="bg-slate-950">

<div class="flex flex-col h-screen">

    <!-- ================= NAVBAR ================= -->

    <nav class="bg-slate-900 border-b border-slate-800">

        <div class="max-w-7xl mx-auto px-6">

            <div class="h-16 flex justify-between items-center">

                <div class="flex items-center gap-3">

                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center">

                        🤖

                    </div>

                    <div>

                        <h1 class="text-white text-lg font-bold">
                            AI ChatBot
                        </h1>

                        <p class="text-xs text-slate-400">
                            Powered by AI
                        </p>

                    </div>

                </div>

                <div class="flex items-center gap-4">

                    <button class="text-slate-300 hover:text-white">

                        <i class="fa-solid fa-moon text-lg"></i>

                    </button>

                    <div class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-500 to-indigo-500 flex items-center justify-center text-white font-bold">

                        N

                    </div>

                </div>

            </div>

        </div>

    </nav>

    <!-- ================= CHAT AREA ================= -->

    <main
    id="chatBox"
    class="flex-1 overflow-y-auto p-8 space-y-8">

        <!-- AI Message -->

        <div class="flex">

            <div class="bg-slate-900 rounded-2xl p-5 max-w-xl border border-slate-800 shadow-lg">

                <div class="flex gap-3">

                    <div class="text-2xl">

                        🤖

                    </div>

                    <div>

                        <h3 class="text-white font-semibold">

                            AI Assistant

                        </h3>

                        <p class="text-slate-300 mt-2">

                            Hello 👋

                            <br><br>

                            How can I help you today?

                        </p>

                    </div>

                </div>

            </div>

        </div>

        <!-- User Message -->

        <div class="flex justify-end">

            <div class="bg-indigo-600 rounded-2xl p-5 max-w-lg shadow-xl">

                <p class="text-white">

                    Explain Git and GitHub.

                </p>

            </div>

        </div>

        <!-- AI Message -->

        <div class="flex">

            <div class="bg-slate-900 rounded-2xl p-5 max-w-xl border border-slate-800">

                <div class="flex gap-3">

                    <div class="text-2xl">

                        🤖

                    </div>

                    <div>

                        <h3 class="text-white font-semibold">

                            AI Assistant

                        </h3>

                        <p class="text-slate-300 mt-2">

                            Git is a version control system that helps developers
                            track changes in code, while GitHub is a cloud platform
                            used to host Git repositories and collaborate with others.

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- TEAMMATE C WILL ADD INPUT HERE -->

    <!-- TEAMMATE B WILL ADD FOOTER HERE -->

</div>

<script src="script.js"></script>

</body>
</html>
